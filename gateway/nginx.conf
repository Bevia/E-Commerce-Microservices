user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format gateway_json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

    access_log /dev/stdout gateway_json;
    error_log /dev/stderr warn;

    server_tokens off;
    client_max_body_size 1m;
    keepalive_timeout 30s;

    limit_req_zone $binary_remote_addr zone=authentication_rate:10m rate=10r/s;
    limit_req_status 429;

    upstream authentication_backend {
        server auth-service:8083;
        keepalive 16;
    }

    upstream order_backend {
        server order-service:8080;
        keepalive 16;
    }

    upstream payment_backend {
        server payment-service:8081;
        keepalive 16;
    }

    server {
        listen 8080;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /health {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"UP","component":"gateway"}';
        }

        location /api/auth/ {
            limit_req zone=authentication_rate burst=20 nodelay;
            proxy_pass http://authentication_backend;
            include /etc/nginx/conf.d/proxy_params;
        }

        location /api/orders {
            proxy_pass http://order_backend;
            include /etc/nginx/conf.d/proxy_params;
        }

        location /api/payments {
            proxy_pass http://payment_backend;
            include /etc/nginx/conf.d/proxy_params;
        }

        location / {
            add_header Content-Type application/json always;
            return 404 '{"error":"not_found"}';
        }
    }
}
