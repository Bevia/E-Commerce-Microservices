spring.application.name=OrderMicroservice
# Server Port - IMPORTANT: Use a DIFFERENT port than your Payment Service (e.g., 8080)
server.port=8080

# H2 Database Configuration (for Order Service's own database)
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false

# Enable debug logging for more detail if needed
debug=true

# JWT Configuration (MUST match Auth service's secret!)
# Secret must be Base64-encoded for JJWT library
app.jwt.secret=${JWT_SECRET:WW91clN1cGVyU2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb25XaGljaFNob3VsZEJlVmVyeUxvbmdBbmRDb21wbGV4}

# Operational health endpoints used by Docker and Kubernetes probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
