spring.application.name=PaymentMicroservice

# Server Port
# A different port than default 8080 to avoid conflicts if other services run
server.port=8081

# H2 Database Configuration
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
debug=true

# JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'update' creates/updates schema, 'create' drops and recreates
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false

# JWT Configuration (MUST match Auth service's secret!)
# Secret must be Base64-encoded for JJWT library
app.jwt.secret=${JWT_SECRET:WW91clN1cGVyU2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb25XaGljaFNob3VsZEJlVmVyeUxvbmdBbmRDb21wbGV4}

# Operational health endpoints used by Docker and Kubernetes probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
