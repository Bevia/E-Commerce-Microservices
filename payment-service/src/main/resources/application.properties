# Server Port
# A different port than default 8080 to avoid conflicts if other services run
server.port=8081

# H2 Database Configuration
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
debug=true

# JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 'update' creates/updates schema, 'create' drops and recreates
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration (MUST match Auth service's secret!)
# Secret must be Base64-encoded for JJWT library
